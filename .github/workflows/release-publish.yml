name: Release Publish

# Builds, releases, and attests a tagged version in one trusted CI run so the
# published archives carry SLSA build provenance bound to their digests. The
# Homebrew cask push is left to a credentialed maintainer step (it needs write
# access to the separate tap repository), so it is skipped here.

on:
  push:
    tags:
      - 'v*'

permissions: {}

env:
  GO_VERSION: '1.26.1'
  GORELEASER_VERSION: v2.17.0
  SYFT_VERSION: v1.42.3
  GOTOOLCHAIN: local

jobs:
  public-oss-boundary:
    name: Require public OSS repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed unless source is public
        shell: bash
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: test "$REPOSITORY_VISIBILITY" = 'public'

  release:
    needs: public-oss-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source and tags
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false
      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Build and publish the release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --skip=homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance for the shipped archives
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
      - name: Publish the draft and attach the provenance bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          version="${TAG#v}"
          cp "$BUNDLE" "flowbaton_${version}.intoto.jsonl"
          gh release upload "$TAG" "flowbaton_${version}.intoto.jsonl" --clobber
          gh release edit "$TAG" --draft=false --latest
