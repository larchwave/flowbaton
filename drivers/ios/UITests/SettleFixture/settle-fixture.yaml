appId: dev.larchwave.flowbaton.settlefixture
name: Settle fixture launch, alert action, field under a footer, toggle and native back, tap under decorative animation, scroll over a link, centre the end, reach a tall card
---
- launchApp
- assertVisible:
    id: fixture.continue
# An app-owned alert: the destructive button must run its action (issue #17).
- tapOn:
    id: fixture.alert.show
- assertVisible: End without saving
- tapOn: End without saving
- assertVisible:
    id: fixture.alert.ended
# A text field under the form's opaque footer: its bounds are inside the
# screen from the start, and only a hit test says it cannot be touched yet
# (issue #14).
- tapOn:
    id: fixture.form.show
- scrollUntilVisible:
    element:
      id: fixture.footer.field
    direction: DOWN
    visibilityPercentage: 100
- tapOn:
    id: fixture.footer.field
- inputText: Test
- assertVisible: Test
- tapOn:
    id: fixture.form.close
# A SwiftUI Toggle spans its Form row; only the switch at the trailing edge
# turns it (issue #40).
- tapOn:
    id: fixture.nav.show
- tapOn:
    id: fixture.toggle
- assertVisible:
    id: fixture.toggle.on
# back pops one native navigation level by the system back button, which has
# no app-owned identifier (issue #41).
- tapOn:
    id: fixture.nav.push1
- tapOn:
    id: fixture.nav.push2
- assertVisible:
    id: fixture.nav.level2
- back
- assertVisible:
    id: fixture.nav.level1
- back
- assertVisible:
    id: fixture.nav.push1
- tapOn:
    id: fixture.nav.close
- tapOn:
    id: fixture.continue
- assertVisible:
    id: fixture.continued
# The end marker comes into view at the bottom edge; centring it must keep
# it on screen rather than push it back off (issue #13).
- scrollUntilVisible:
    element:
      id: fixture.end
    direction: DOWN
    centerElement: true
- assertVisible:
    id: fixture.end
- assertNotVisible:
    id: fixture.linkActivated
# Three tall cards follow the end marker. A fixed step of the default size
# carried the second one past the screen and kept going (issue #16).
- scrollUntilVisible:
    element:
      id: fixture.card.2
    direction: DOWN
    visibilityPercentage: 100
- assertVisible:
    id: fixture.card.2
