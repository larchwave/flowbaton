appId: dev.larchwave.flowbaton.settlefixture
name: Settle fixture launch, tap under decorative animation, scroll over a link
---
- launchApp
- assertVisible:
    id: fixture.continue
- tapOn:
    id: fixture.continue
- assertVisible:
    id: fixture.continued
- scrollUntilVisible:
    element:
      id: fixture.end
    direction: DOWN
- assertNotVisible:
    id: fixture.linkActivated
