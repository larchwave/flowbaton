appId: dev.larchwave.flowbaton.settlefixture
name: Settle fixture launch, tap under decorative animation, scroll over a link, centre the end, reach a tall card
---
- launchApp
- assertVisible:
    id: fixture.continue
- tapOn:
    id: fixture.continue
- assertVisible:
    id: fixture.continued
# The end marker comes into view at the bottom edge; centring it must keep
# it on screen rather than push it back off (issue #13).
- scrollUntilVisible:
    element:
      id: fixture.end
    direction: DOWN
    centerElement: true
- assertVisible:
    id: fixture.end
- assertNotVisible:
    id: fixture.linkActivated
# Three tall cards follow the end marker. A fixed step of the default size
# carried the second one past the screen and kept going (issue #16).
- scrollUntilVisible:
    element:
      id: fixture.card.2
    direction: DOWN
    visibilityPercentage: 100
- assertVisible:
    id: fixture.card.2
