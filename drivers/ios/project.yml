name: FlowBatonIOSRunner

options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    # Physical-device builds need a signing team. Export FLOWBATON_IOS_TEAM
    # before `xcodegen generate`; simulator-only builds may leave it unset.
    DEVELOPMENT_TEAM: ${FLOWBATON_IOS_TEAM}
    GENERATE_INFOPLIST_FILE: true
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  FlowBatonIOSRunner:
    type: framework
    platform: iOS
    sources:
      - path: Sources/FlowBatonIOSRunner
    settings:
      base:
        DEFINES_MODULE: true
        PRODUCT_BUNDLE_IDENTIFIER: dev.larchwave.flowbaton.driver
        SKIP_INSTALL: true

  FlowBatonIOSRunnerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FlowBatonIOSRunnerTests
    dependencies:
      - target: FlowBatonIOSRunner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.larchwave.flowbaton.driver.tests
        SKIP_INSTALL: true

  FlowBatonIOSRunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/FlowBatonIOSRunnerUITests
    dependencies:
      - target: FlowBatonIOSRunner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.larchwave.flowbaton.driver.uitests
        SKIP_INSTALL: true

  # The settle fixture is a test subject, not a driver: a screen with a
  # continuously redrawn decoration hidden from accessibility and a stationary
  # enabled button (issue #7). It has its own scheme on purpose. The release
  # packager archives the runner scheme's whole Products directory, so
  # building the fixture there would ship it.
  FlowBatonSettleFixture:
    type: application
    platform: iOS
    sources:
      - path: UITests/SettleFixture
        excludes:
          - "*.yaml"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.larchwave.flowbaton.settlefixture
        SUPPORTED_PLATFORMS: iphonesimulator
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SKIP_INSTALL: true

schemes:
  FlowBatonIOSRunner:
    build:
      targets:
        FlowBatonIOSRunner: all
        FlowBatonIOSRunnerTests: [test, analyze]
    test:
      targets:
        - FlowBatonIOSRunnerTests

  FlowBatonIOSRunnerUITests:
    build:
      targets:
        FlowBatonIOSRunner: all
        FlowBatonIOSRunnerUITests: [test, analyze]
    test:
      targets:
        - FlowBatonIOSRunnerUITests

  FlowBatonSettleFixture:
    build:
      targets:
        FlowBatonSettleFixture: all
