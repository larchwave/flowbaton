name: FlowBatonIOSRunner

options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: true
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTED_PLATFORMS: iphonesimulator
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  FlowBatonIOSRunner:
    type: framework
    platform: iOS
    sources:
      - path: Sources/FlowBatonIOSRunner
    settings:
      base:
        DEFINES_MODULE: true
        PRODUCT_BUNDLE_IDENTIFIER: dev.larchwave.flowbaton.driver
        SKIP_INSTALL: true

  FlowBatonIOSRunnerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FlowBatonIOSRunnerTests
    dependencies:
      - target: FlowBatonIOSRunner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.larchwave.flowbaton.driver.tests
        SKIP_INSTALL: true

  FlowBatonIOSRunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/FlowBatonIOSRunnerUITests
    dependencies:
      - target: FlowBatonIOSRunner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.larchwave.flowbaton.driver.uitests
        SKIP_INSTALL: true

schemes:
  FlowBatonIOSRunner:
    build:
      targets:
        FlowBatonIOSRunner: all
        FlowBatonIOSRunnerTests: [test, analyze]
    test:
      targets:
        - FlowBatonIOSRunnerTests

  FlowBatonIOSRunnerUITests:
    build:
      targets:
        FlowBatonIOSRunner: all
        FlowBatonIOSRunnerUITests: [test, analyze]
    test:
      targets:
        - FlowBatonIOSRunnerUITests
